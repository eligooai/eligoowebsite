server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the host nginx terminates TLS and proxies here
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml;

    # API + uploaded media (the /api/ and /uploads/ prefixes are reserved by
    # legacy merchant widgets at the host level, hence /eapi/ and /media/)
    location /eapi/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16M;
    }
    location /media/ {
        proxy_pass http://api:4000;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ONE sitemap: the API merges the prerendered routes (dist/routes.json) with blog posts
    # and legal pages. If the API is down, the static build-time sitemap is served instead.
    location = /sitemap.xml {
        proxy_pass http://api:4000/eapi/sitemap.xml;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sitemap_static;
    }
    location @sitemap_static {
        try_files /sitemap.xml =404;
    }

    # legacy blog URLs → /resources/blog/…
    location = /blog { return 301 /resources/blog/; }
    location = /blog/ { return 301 /resources/blog/; }
    location ~ ^/blog/(.+?)/?$ { return 301 /resources/blog/$1/; }

    # blog index is prerendered; individual posts come from the API so each ships with its own
    # SEO meta tags. If the API is down we fall back to the plain SPA shell.
    location = /resources/blog/ {
        add_header Cache-Control "no-cache";
        try_files /resources/blog/index.html =404;
    }
    location = /resources/blog { return 301 /resources/blog/; }
    location /resources/blog/ {
        proxy_pass http://api:4000/render$request_uri;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }
    # legal / admin-editable pages are client-rendered from the shell
    location /p/ {
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }
    location @spa {
        try_files /app.html =404;
    }

    # hashed build assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D models, character renders, brand and fonts — large, static, versioned by content
    location ~* ^/(models|employees|brand|fonts)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* ^/(favicon\.svg|icons\.svg|robots\.txt|llms\.txt|routes\.json)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # prerendered pages: /solutions/voice/ → /solutions/voice/index.html;
    # /solutions/voice (no slash) is 301'd to the slash form by nginx's directory handling.
    # Unknown paths get the prerendered 404 page with a real 404 status.
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
