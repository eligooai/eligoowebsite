server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the host nginx terminates TLS and proxies here
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml;

    # hashed build assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D models and the hero frame sequences — large, static, versioned by content
    location ~* ^/(models|frames|employees|brand)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
