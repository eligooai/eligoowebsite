server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the host nginx terminates TLS and proxies here
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml;


    # API + uploaded media (the /api/ and /uploads/ prefixes are reserved by
    # legacy merchant widgets at the host level, hence /eapi/ and /media/)
    location /eapi/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16M;
    }
    location /media/ {
        proxy_pass http://api:4000;
        add_header Cache-Control "public, max-age=2592000";
    }
    location = /sitemap.xml {
        proxy_pass http://api:4000/eapi/sitemap.xml;
    }

    # blog HTML comes from the API so each post ships with real SEO meta tags;
    # if the API is down we fall back to the plain SPA shell
    location /blog {
        proxy_pass http://api:4000/render$request_uri;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @spa;
    }
    location @spa {
        try_files /index.html =404;
    }

    # hashed build assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D models and the hero frame sequences — large, static, versioned by content
    location ~* ^/(models|frames|employees|brand)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
